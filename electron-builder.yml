# electron-builder configuration (portable Windows distribution, finalized in M7 / PLAN §7 M7
# "electron-builder ポータブル配布" / DESIGN §6). No code signing (out of v1 scope). No custom
# app icon asset in use (ユーザー判断でicon01/icon02運用を一旦取りやめ, developer 判断で
# electron-builderの既定アイコンにフォールバック); icon01.png/icon02.pngは将来再検討用に
# リポジトリには残す。
appId: com.tabtreenote.app
productName: TabTreeNote
directories:
  output: release
files:
  - out/**/*
  - package.json
win:
  target: portable
  artifactName: ${productName}-${version}-portable.${ext}
asar: true
