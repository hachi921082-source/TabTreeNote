# electron-builder configuration (portable Windows distribution, finalized in M7 / PLAN §7 M7
# "electron-builder ポータブル配布" / DESIGN §6). No code signing (out of v1 scope). No custom
# app icon asset exists in this repo yet (v1 known gap, developer judgment call: electron-builder
# falls back to its own default icon when `win.icon` is omitted); add `win.icon: build/icon.ico`
# here once a proper icon asset is created.
appId: com.tabtreenote.app
productName: TabTreeNote
directories:
  output: release
files:
  - out/**/*
  - package.json
win:
  target: portable
  artifactName: ${productName}-${version}-portable.${ext}
asar: true
