# electron-builder configuration (portable Windows distribution, finalized in M7 / PLAN §7 M7
# "electron-builder ポータブル配布" / DESIGN §6). No code signing (out of v1 scope).
appId: com.tabtreenote.app
productName: TabTreeNote
directories:
  output: release
files:
  - out/**/*
  - package.json
  - icon01.png
win:
  target: portable
  artifactName: ${productName}-${version}-portable.${ext}
  # 実行ファイル（配布アイコン）本体のアイコン。ウィンドウのタイトルバー用アイコン
  # （icon01.png、別素材）は main/index.ts の BrowserWindow.icon で個別に指定する（ユーザー要望）。
  icon: icon02.png
asar: true
